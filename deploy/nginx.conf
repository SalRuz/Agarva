# Example nginx site for Timeweb / Reg.ru VPS
# 1) Put built client into /var/www/agarwa (contents of dist/)
# 2) Copy this file to /etc/nginx/sites-available/agarwa
# 3) ln -s /etc/nginx/sites-available/agarwa /etc/nginx/sites-enabled/
# 4) Replace YOUR_DOMAIN with your domain, then: certbot --nginx -d YOUR_DOMAIN
# 5) nginx -t && systemctl reload nginx

upstream agarwa_ws {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # After certbot this block usually becomes HTTPS redirect; keep HTTP for ACME.
    root /var/www/agarwa;
    index index.html;

    # Static single-file client (vite-plugin-singlefile → dist/index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket → Node (path /ws → backend /)
    location /ws {
        proxy_pass http://agarwa_ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# After `certbot --nginx`, Certbot adds a listen 443 ssl server.
# Ensure the same location /ws { ... } block exists in the HTTPS server
